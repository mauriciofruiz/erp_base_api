# ===========================================
# ERP BASE API - Application Properties
# ===========================================
# This file now uses environment variables for sensitive data
# Make sure to set the corresponding environment variables in your .env file

# Server Configuration
server.port=${SERVER_PORT:8087}

# Database Configuration (R2DBC)
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:database123}
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://host.docker.internal:5432/erp_double}

# Database Connection Pool Settings
spring.r2dbc.pool.max-idle-time=${DB_POOL_MAX_IDLE_TIME:30}
spring.r2dbc.pool.initial-size=${DB_POOL_INITIAL_SIZE:5}
spring.r2dbc.pool.max-size=${DB_POOL_MAX_SIZE:50}

# JWT Configuration
jwt.secret=${JWT_SECRET:secretsecretsecretsecretsecretsecretsecretsecretsecret}

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.erp.base.api=${LOGGING_LEVEL_ERP_BASE_API:DEBUG}

# Management Endpoints
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Additional Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
