# ===========================================
# ERP BASE API - Application Properties
# ===========================================
# This file now uses environment variables for sensitive data
# Make sure to set the corresponding environment variables in your .env file

# Server Configuration
server.port=${SERVER_PORT}

# Database Configuration (R2DBC)
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:database123}
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/erp_double?currentSchema=double}
spring.r2dbc.schema=${DB_SCHEMA:double}

# Database Connection Pool Settings
spring.r2dbc.pool.max-idle-time=${DB_POOL_MAX_IDLE_TIME}
spring.r2dbc.pool.initial-size=${DB_POOL_INITIAL_SIZE}
spring.r2dbc.pool.max-size=${DB_POOL_MAX_SIZE}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Logging Configuration
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.erp.base.api=${LOGGING_LEVEL_ERP_BASE_API}

# Management Endpoints
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# Additional Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=true
springdoc.packages-to-scan=erp.base.api
